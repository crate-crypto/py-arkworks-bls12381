[package]
name = "py_arkworks_bls12381"
version = "0.5.0"
edition = "2024"

[lib]
name = "py_arkworks_bls12381"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["num-bigint"] }
ark-bls12-381 = "0.4.0"
ark-serialize = "0.4.0"
ark-ec = "0.4.0"
ark-ff = "0.4.0"
# Used by arkworks' RFC 9380 hash-to-curve (expand_message_xmd over SHA-256).
# sha2 is only a dev-dependency of ark-ff, so we depend on it directly.
sha2 = "0.10"
hex = "0.4"
num-traits = "0.2"
num-bigint = "0.4"

[features]
default = ["asm"]
asm = ["ark-ff/asm"]
